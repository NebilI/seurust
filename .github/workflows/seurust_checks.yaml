name: seurust Checks

# PR / push tests for the seurust package (Rust kernels + R wrappers).
on:
  pull_request:
    paths:
      - 'seurust/**'
      - 'docker/scripts/**'
      - 'docker/docker-compose.yml'
      - 'docker/Dockerfile.rust'
      - 'docker/Dockerfile.rcpp'
      - '.github/workflows/seurust_checks.yaml'
      - '.github/workflows/build-seurust-cran.yaml'
  push:
    branches:
      - main
      - feature/rust-rewrite
    paths:
      - 'seurust/**'
      - 'docker/scripts/**'
      - 'docker/docker-compose.yml'
      - 'docker/Dockerfile.rust'
      - 'docker/Dockerfile.rcpp'
      - '.github/workflows/seurust_checks.yaml'
      - '.github/workflows/build-seurust-cran.yaml'
  workflow_dispatch:

concurrency:
  group: seurust-checks-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-seurust:
    name: "check seurust (ubuntu)"
    runs-on: ubuntu-latest
    env:
      NOT_CRAN: true

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          extra-repositories: 'https://satijalab.r-universe.dev https://bnprks.r-universe.dev'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Add Rust to PATH
        run: echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"

      - name: Cache Cargo registry and seurust target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            seurust/src/rust/target
          key: ${{ runner.os }}-cargo-seurust-${{ hashFiles('seurust/src/rust/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-seurust-

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev \
            llvm-dev \
            patchelf

      - name: Install R dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: seurust
          extra-packages: any::rcmdcheck any::testthat
          dependencies: '"soft"'

      - name: Configure seurust
        working-directory: seurust
        run: Rscript tools/config.R
        env:
          NOT_CRAN: true
          SEURAT_KEEP_RUST_TARGET: true

      - name: Build source tarball
        run: R CMD build seurust

      - name: Check source tarball
        run: |
          set +e
          R CMD check seurust_*.tar.gz --as-cran --no-manual 2>&1 | tee seurust-check.log
          status=${PIPESTATUS[0]}
          if [ "$status" -ne 0 ]; then
            echo "::group::R CMD check install log"
            cat seurust.Rcheck/00install.out || true
            echo "::endgroup::"
            exit "$status"
          fi
        env:
          _R_CHECK_CRAN_INCOMING_: false
          _R_CHECK_PACKAGE_SIZES_: false
          SEURAT_KEEP_RUST_TARGET: true

      - name: Run seurust tests
        run: |
          R CMD INSTALL seurust_*.tar.gz
          Rscript -e 'testthat::test_dir("seurust/tests/testthat")'

      - name: Upload check artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seurust-pr-check
          path: |
            seurust-check.log
            seurust.Rcheck/00check.log
            seurust.Rcheck/00install.out
          if-no-files-found: ignore
