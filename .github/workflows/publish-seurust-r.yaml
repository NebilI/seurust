name: Publish seurust R package

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish. Leave empty to use v<Version> from seurust/DESCRIPTION.
        required: false
        type: string
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the tarball to and point r-universe at
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-r:
    name: Build tarball and sync r-universe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          extra-repositories: 'https://satijalab.r-universe.dev'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev \
            llvm-dev \
            patchelf

      - name: Install R build dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: seurust
          dependencies: '"hard"'

      - name: Configure seurust
        working-directory: seurust
        run: Rscript tools/config.R
        env:
          NOT_CRAN: true

      - name: Build source tarball
        run: R CMD build seurust

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          # A reusable workflow keeps the caller's event name, so a manual
          # Release seurust run arrives here as workflow_dispatch. Prefer an
          # explicit tag, then the release event, then DESCRIPTION.
          INPUT_TAG: ${{ inputs.tag }}
          RELEASE_TAG_NAME: ${{ github.event.release.tag_name }}
        run: |
          set -euo pipefail
          if [ -n "${INPUT_TAG}" ]; then
            tag="${INPUT_TAG}"
          elif [ "$EVENT_NAME" = "release" ] && [ -n "${RELEASE_TAG_NAME}" ]; then
            tag="${RELEASE_TAG_NAME}"
          else
            version=$(awk '/^Version:[[:space:]]*/ { print $2; exit }' seurust/DESCRIPTION)
            if [ -z "${version}" ]; then
              echo "Could not read Version from seurust/DESCRIPTION" >&2
              exit 1
            fi
            tag="v${version}"
          fi
          echo "name=${tag}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: seurust_*.tar.gz

      - name: Sync r-universe registry
        env:
          UNIVERSE_TOKEN: ${{ secrets.R_UNIVERSE_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          if [ -z "$UNIVERSE_TOKEN" ]; then
            echo "::warning::R_UNIVERSE_REGISTRY_TOKEN not configured; skipping r-universe sync"
            exit 0
          fi
          git clone "https://x-access-token:${UNIVERSE_TOKEN}@github.com/NebilI/NebilI.r-universe.dev.git" universe-registry
          cd universe-registry
          cat > packages.json <<EOF
          [
            {
              "package": "seurust",
              "url": "https://github.com/NebilI/seurust",
              "subdir": "seurust",
              "branch": "${RELEASE_TAG}"
            }
          ]
          EOF
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add packages.json
          git diff --cached --quiet || git commit -m "Point seurust at release ${RELEASE_TAG}"
          git push
