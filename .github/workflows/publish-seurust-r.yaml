name: Publish seurust R package

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:
    inputs:
      tag:
        description: Release tag to attach the tarball to and point r-universe at
        required: true
        type: string

permissions:
  contents: write

jobs:
  publish-r:
    name: Build tarball and sync r-universe
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
          extra-repositories: 'https://satijalab.r-universe.dev'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev \
            llvm-dev \
            patchelf

      - name: Install R build dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          working-directory: seurust
          dependencies: '"hard"'

      - name: Configure seurust
        working-directory: seurust
        run: Rscript tools/config.R
        env:
          NOT_CRAN: true

      - name: Build source tarball
        run: R CMD build seurust

      - name: Resolve release tag
        id: tag
        env:
          EVENT_NAME: ${{ github.event_name }}
          CALL_TAG: ${{ github.event_name == 'workflow_call' && inputs.tag || '' }}
          RELEASE_TAG_NAME: ${{ github.event_name == 'release' && github.event.release.tag_name || '' }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_call" ]; then
            tag="$CALL_TAG"
          else
            tag="$RELEASE_TAG_NAME"
          fi
          if [ "$EVENT_NAME" != "workflow_dispatch" ] && [ -z "$tag" ]; then
            echo "Release tag is empty" >&2
            exit 1
          fi
          echo "name=${tag}" >> "$GITHUB_OUTPUT"

      - name: Upload release asset
        if: github.event_name == 'release' || github.event_name == 'workflow_call'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: seurust_*.tar.gz

      - name: Upload workflow artifact
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: seurust-source
          path: seurust_*.tar.gz

      - name: Sync r-universe registry
        if: github.event_name == 'release' || github.event_name == 'workflow_call'
        env:
          UNIVERSE_TOKEN: ${{ secrets.R_UNIVERSE_REGISTRY_TOKEN }}
          RELEASE_TAG: ${{ steps.tag.outputs.name }}
        run: |
          set -euo pipefail
          if [ -z "$UNIVERSE_TOKEN" ]; then
            echo "::warning::R_UNIVERSE_REGISTRY_TOKEN not configured; skipping r-universe sync"
            exit 0
          fi
          git clone "https://x-access-token:${UNIVERSE_TOKEN}@github.com/NebilI/NebilI.r-universe.dev.git" universe-registry
          cd universe-registry
          cat > packages.json <<EOF
          [
            {
              "package": "seurust",
              "url": "https://github.com/NebilI/seurust",
              "subdir": "seurust",
              "branch": "${RELEASE_TAG}"
            }
          ]
          EOF
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git add packages.json
          git diff --cached --quiet || git commit -m "Point seurust at release ${RELEASE_TAG}"
          git push
