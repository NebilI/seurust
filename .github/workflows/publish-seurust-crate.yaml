name: Publish seurust crate

on:
  release:
    types: [published]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

jobs:
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seurust/src/rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev \
            llvm-dev

      - name: Verify crate packages cleanly
        run: |
          export R_HOME="$(R RHOME)"
          cargo publish --dry-run

      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CRATES_IO_TOKEN not configured; skipping crates.io publish"
            exit 0
          fi
          export R_HOME="$(R RHOME)"
          set +e
          output=$(cargo publish --token "$CARGO_REGISTRY_TOKEN" 2>&1)
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -ne 0 ]; then
            if printf '%s\n' "$output" | grep -q "already uploaded"; then
              echo "This version is already on crates.io"
              exit 0
            fi
            exit "$status"
          fi
