name: Publish seurust crate

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish-crate:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: seurust/src/rust

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libclang-dev \
            llvm-dev

      # Apt r-base leaves /usr/local/lib/R/site-library unwritable for the
      # runner. setup-r provides a user library; install Rcpp/RcppEigen there
      # so build.rs can find Eigen headers during cargo publish.
      - name: Install RcppEigen
        run: |
          mkdir -p "${HOME}/R/library"
          export R_LIBS_USER="${HOME}/R/library"
          echo "R_LIBS_USER=${R_LIBS_USER}" >> "${GITHUB_ENV}"
          Rscript -e 'install.packages(c("Rcpp", "RcppEigen"), lib = Sys.getenv("R_LIBS_USER"))'

      - name: Verify crate packages cleanly
        run: |
          export R_HOME="$(R RHOME)"
          cargo publish --dry-run

      - name: Publish to crates.io
        if: github.event_name == 'release' || github.event_name == 'workflow_dispatch'
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_TOKEN }}
        run: |
          if [ -z "$CARGO_REGISTRY_TOKEN" ]; then
            echo "::warning::CRATES_IO_TOKEN not configured; skipping crates.io publish"
            exit 0
          fi
          export R_HOME="$(R RHOME)"
          cargo publish --token "$CARGO_REGISTRY_TOKEN"
