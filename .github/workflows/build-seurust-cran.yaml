name: Build / submit seurust to CRAN

# Manual CRAN updates only (no push or release auto-upload to CRAN):
#   Actions → "Build / submit seurust to CRAN" → Run workflow
#   - leave submit_to_cran=false for a dry-run build/check + tarball artifact
#   - set submit_to_cran=true to upload after a clean check (confirm email afterward)
on:
  workflow_dispatch:
    inputs:
      submit_to_cran:
        description: "Upload the checked tarball to CRAN (confirm the maintainer email afterward)"
        type: boolean
        default: false
  release:
    types: [published]

permissions:
  contents: write

jobs:
  cran-tarball:
    name: Docker Compose CRAN build/check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
        with:
          # docker driver sees locally tagged images between sequential builds
          driver: docker

      - name: Build rust-dev image
        run: |
          # Build base image first; parallel compose build makes buildx try to
          # pull seurust-rcpp:dev from Docker Hub (it is a local tag only).
          docker compose -f docker/docker-compose.yml build rcpp-dev
          docker compose -f docker/docker-compose.yml build rust-dev

      - name: Normalize scripts for Linux containers
        run: |
          sed -i 's/\r$//' docker/scripts/check-seurust-cran.sh \
            docker/scripts/submit-seurust-cran.sh \
            docker/scripts/vendor-seurust.sh \
            seurust/tools/vendor.sh \
            seurust/configure \
            seurust/configure.win \
            seurust/cleanup \
            seurust/cleanup.win || true
          chmod +x docker/scripts/check-seurust-cran.sh \
            docker/scripts/submit-seurust-cran.sh \
            docker/scripts/vendor-seurust.sh \
            seurust/tools/vendor.sh \
            seurust/configure \
            seurust/configure.win \
            seurust/cleanup \
            seurust/cleanup.win

      - name: CRAN build and check via Compose
        run: |
          docker compose -f docker/docker-compose.yml run --rm --no-TTY seurust-cran

      - name: Upload CRAN tarball
        uses: actions/upload-artifact@v4
        with:
          name: seurust-cran-source
          path: seurust_*.tar.gz
          if-no-files-found: error

      - name: Attach tarball to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          files: seurust_*.tar.gz

      - name: Upload check log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: seurust-cran-check-log
          path: seurust.Rcheck/00check.log
          if-no-files-found: ignore

      - name: Submit tarball to CRAN
        if: github.event_name == 'workflow_dispatch' && inputs.submit_to_cran
        run: |
          docker compose -f docker/docker-compose.yml run --rm --no-TTY \
            -e SUBMIT_CRAN=yes \
            -e READY_TO_PUBLISH=yes \
            -e SKIP_CHECK=yes \
            seurust-cran-submit

      - name: Reminder — confirm CRAN email
        if: github.event_name == 'workflow_dispatch' && inputs.submit_to_cran
        run: |
          echo "::notice::CRAN upload finished. Confirm the email sent to the Maintainer in seurust/DESCRIPTION, then watch https://cran.r-project.org/package=seurust"
